<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>欢迎</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f7fb;
      color: #1e293b;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 640px;
      min-width: 0;
      padding: clamp(24px, 6vw, 64px);
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      background: #fff;
      text-align: center;
      overflow-wrap: anywhere;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>欢迎！</h1>
  </main>
</body>
</html>
